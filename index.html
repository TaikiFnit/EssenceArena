<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#0a0a0f; font-family:'Inter',sans-serif; color:#e8e8ec; }
canvas { display:block; cursor:crosshair; }
#ui-layer { position:fixed; inset:0; pointer-events:none; z-index:10; }
#ui-layer button, #ui-layer [data-interactive] { pointer-events:auto; }

#title-screen {
  position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%);
  pointer-events:auto;
}
#title-screen h1 {
  font-family:'Cormorant Garamond',serif; font-size:clamp(3rem,8vw,6rem);
  font-weight:700; letter-spacing:0.05em; color:#e8e8ec;
  text-shadow:0 0 40px rgba(78,200,176,0.3), 0 0 80px rgba(78,200,176,0.1);
  margin-bottom:0.5em;
}
#title-screen .subtitle { font-size:14px; color:#8888a0; margin-bottom:2em; text-align:center; line-height:1.6; }
#title-screen button {
  background:rgba(78,200,176,0.15); border:1px solid rgba(78,200,176,0.3);
  color:#4ec8b0; padding:12px 40px; font-size:16px; font-family:'Inter',sans-serif;
  font-weight:600; border-radius:6px; cursor:pointer; transition:all 0.2s;
}
#title-screen button:hover { background:rgba(78,200,176,0.25); border-color:rgba(78,200,176,0.5); }
.controls-info { margin-top:2em; font-size:12px; color:#666; text-align:center; line-height:2; }
.controls-info kbd {
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
  padding:2px 8px; border-radius:4px; font-family:'Inter',sans-serif; font-size:11px;
}

#hud { position:fixed; top:28px; left:16px; z-index:20; pointer-events:none; }
.hud-bar { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.hud-bar-label { font-size:11px; font-weight:600; color:#8888a0; width:50px; text-align:right; }
.hud-bar-track { width:160px; height:8px; background:rgba(255,255,255,0.08); border-radius:4px; overflow:hidden; }
.hud-bar-fill { height:100%; border-radius:4px; transition:width 0.3s; }
.hp-fill { background:linear-gradient(90deg,#ff4466,#ff6688); }
.essence-fill { background:linear-gradient(90deg,#4ec8b0,#6ee8d0); }
.hud-text { font-size:11px; font-weight:600; color:#e8e8ec; font-variant-numeric:tabular-nums lining-nums; min-width:50px; }
.hud-level { font-size:13px; font-weight:700; color:#4ec8b0; margin-left:4px; }

#hud-stats {
  position:fixed; top:16px; right:16px; z-index:20; pointer-events:none;
  font-size:11px; color:#8888a0; text-align:right; line-height:1.8;
  font-variant-numeric:tabular-nums lining-nums;
}

#death-screen {
  position:fixed; inset:0; z-index:100; display:none; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(10,10,15,0.92); pointer-events:auto;
}
#death-screen h2 {
  font-family:'Cormorant Garamond',serif; font-size:clamp(2.5rem,6vw,4rem);
  font-weight:700; color:#ff4466;
  text-shadow:0 0 30px rgba(255,68,102,0.4); margin-bottom:0.3em;
}
#death-screen .death-info { font-size:14px; color:#8888a0; margin-bottom:2em; text-align:center; line-height:1.8; }
#death-screen button {
  background:rgba(255,68,102,0.15); border:1px solid rgba(255,68,102,0.3);
  color:#ff6688; padding:12px 40px; font-size:16px; font-family:'Inter',sans-serif;
  font-weight:600; border-radius:6px; cursor:pointer; transition:all 0.2s;
}
#death-screen button:hover { background:rgba(255,68,102,0.25); }

/* Level Up Screen */
#levelup-screen {
  position:fixed; inset:0; z-index:80; display:none; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(10,10,15,0.85); pointer-events:auto;
  backdrop-filter:blur(4px);
}
#levelup-screen h3 {
  font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700;
  color:#4ec8b0; margin-bottom:8px;
  text-shadow:0 0 20px rgba(78,200,176,0.4);
}
#levelup-screen .level-subtitle { font-size:13px; color:#8888a0; margin-bottom:24px; }
.skill-choices { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; padding:0 20px; }
.skill-choice {
  background:rgba(20,20,30,0.9); border:2px solid rgba(255,255,255,0.1);
  border-radius:12px; padding:20px; width:200px; cursor:pointer;
  transition:all 0.2s; text-align:center;
}
.skill-choice:hover { border-color:rgba(78,200,176,0.5); background:rgba(30,30,45,0.9); transform:translateY(-2px); }
.skill-choice-icon { font-size:32px; margin-bottom:8px; }
.skill-choice-name { font-size:15px; font-weight:700; color:#e8e8ec; margin-bottom:4px; }
.skill-choice-level { font-size:12px; color:#4ec8b0; font-weight:600; margin-bottom:6px; }
.skill-choice-desc { font-size:12px; color:#8888a0; line-height:1.4; }

#ability-hud {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  z-index:20; pointer-events:none; display:flex; gap:12px;
}
.ability-slot {
  width:48px; height:48px; border-radius:8px; border:2px solid rgba(255,255,255,0.15);
  background:rgba(15,15,20,0.8); display:flex; align-items:center; justify-content:center;
  position:relative; font-size:18px;
}
.ability-slot .cd-overlay { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.6); border-radius:0 0 6px 6px; }
.ability-slot .cd-text { position:absolute; font-size:11px; font-weight:700; color:#fff; }

#minimap {
  position:fixed; bottom:16px; right:16px; z-index:20; pointer-events:none;
  border:1px solid rgba(255,255,255,0.1); border-radius:4px;
}

#debug {
  position:fixed; top:0; left:0; z-index:99999;
  background:rgba(0,0,0,0.75); color:#0f0;
  font:11px/1.5 monospace; padding:6px 10px;
  pointer-events:none; white-space:pre; display:none;
}

footer { position:fixed; bottom:4px; left:50%; transform:translateX(-50%); z-index:5; font-size:10px; }
footer a { color:#555; text-decoration:none; }
footer a:hover { color:#888; }

<body>

<div id="title-screen">
  <h1>Essence Arena</h1>
  <div class="subtitle">
    虚無から生まれ、エッセンスを奪い合え<br>
    死してなお、魂は巡る
  </div>
  <button id="start-btn" onclick="onStart()">始める</button>
  <div class="controls-info">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動 &nbsp;
    <kbd>左クリック</kbd> 左斬り(赤) &nbsp;
    <kbd>右クリック</kbd> 右斬り(青)<br>
    <kbd>Shift</kbd> ダッシュ &nbsp;
    溜めて斬る居合切りスタイル
  </div>
</div>

<div id="death-screen">
  <h2>散華</h2>
  <div class="death-info" id="death-info"></div>
  <button onclick="onRespawn()">転生する</button>
</div>

<div id="levelup-screen">
  <h3>覚 醒</h3>
  <div class="level-subtitle" id="levelup-subtitle">スキルを一つ選べ</div>
  <div class="skill-choices" id="skill-choices"></div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
  <div id="hud">
    <div class="hud-bar">
      <span class="hud-bar-label">HP</span>
      <div class="hud-bar-track"><div class="hud-bar-fill hp-fill" id="hp-bar"></div></div>
      <span class="hud-text" id="hp-text">3.0/3.0</span>
    </div>
    <div class="hud-bar">
      <span class="hud-bar-label">Essence</span>
      <div class="hud-bar-track"><div class="hud-bar-fill essence-fill" id="essence-bar"></div></div>
      <span class="hud-text" id="essence-text">0</span>
      <span class="hud-level" id="level-text">Lv.0</span>
    </div>
  </div>
  <div id="hud-stats"></div>
  <div id="ability-hud"></div>
</div>

<canvas id="minimap" width="150" height="150"></canvas>
<div id="debug"></div>

<footer>
  <a href="https://www.perplexity.ai/computer" target="_blank" rel="noopener noreferrer">
    Created with Perplexity Computer
  </a>
</footer>

<script src="game.js"></script>
<script>
// --- PC-specific input & UI ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Keyboard input
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Tab') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Mouse
const mouse = { x: 0, y: 0 };
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  if (e.button === 0) inputLeftAttack = true;
  if (e.button === 2) inputRightAttack = true;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

// Input polling
function pollInput() {
  let mx = 0, my = 0;
  if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) my += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  inputMoveX = mx;
  inputMoveY = my;
  inputAngle = Math.atan2(mouse.y - canvas.height/2, mouse.x - canvas.width/2);
  inputAngleAuto = false;
  if (keys['ShiftLeft'] || keys['ShiftRight']) inputDash = true;
}

// Level up UI
function showLevelUp() {
  const screen = document.getElementById('levelup-screen');
  const container = document.getElementById('skill-choices');
  const subtitle = document.getElementById('levelup-subtitle');
  subtitle.textContent = `Level ${getPlayerLevel()} — スキルを一つ選べ`;
  container.innerHTML = levelUpChoices.map((c, i) => `
    <div class="skill-choice" onclick="onSelectSkill(${i})">
      <div class="skill-choice-icon">${c.icon}</div>
      <div class="skill-choice-name">${c.name}</div>
      <div class="skill-choice-level">Lv.${c.currentLevel} → Lv.${c.nextLevel}</div>
      <div class="skill-choice-desc">${c.desc}</div>
    </div>
  `).join('');
  screen.style.display = 'flex';
}

function hideLevelUp() {
  document.getElementById('levelup-screen').style.display = 'none';
}

window.onSelectSkill = function(index) {
  selectSkill(index);
  hideLevelUp();
};

// Death screen
function onPlayerDeath(entity) {
  document.getElementById('death-screen').style.display = 'flex';
  document.getElementById('death-info').innerHTML =
    `倒された<br>蓄積エッセンスは死亡地点に散布された<br>` +
    `散布量: ${Math.floor(entity.totalEssence || 0)}`;
}

// Ability HUD
function updateAbilityHUD() {
  if (!player) return;
  const hud = document.getElementById('ability-hud');
  const maxStocks = getPlayerMaxDashStocks();
  let html = '';
  for (let i = 0; i < maxStocks; i++) {
    const ready = i < player.dashStocks;
    const cdPct = (!ready && i === player.dashStocks) ? (player.dashCooldown / DASH_COOLDOWN) : (ready ? 0 : 1);
    html += `<div class="ability-slot" style="border-color:${ready ? 'rgba(120,140,255,0.5)' : 'rgba(255,255,255,0.1)'}">
      ${!ready ? `<div class="cd-overlay" style="height:${cdPct*100}%"></div>` : ''}
      <span style="font-size:14px;color:${ready?'#8090ff':'#555'}">⇢</span>
      ${!ready && i === player.dashStocks ? `<span class="cd-text">${player.dashCooldown.toFixed(1)}</span>` : ''}
    </div>`;
  }
  hud.innerHTML = html;
}

// Game start
function onStart() {
  document.getElementById('title-screen').style.display = 'none';
  startNewGame();
}

function onRespawn() {
  document.getElementById('death-screen').style.display = 'none';
  doRespawn();
}

// Override game loop to include input polling & level up check
const _origLoop = gameLoop;
let _lastT = 0;
function pcGameLoop(timestamp) {
  requestAnimationFrame(pcGameLoop);
  pollInput();
  const dt = Math.min((timestamp - _lastT) / 1000, 0.1);
  _lastT = timestamp;
  frames++; fpsTime += dt;
  if (fpsTime >= 1) { fps = frames; frames = 0; fpsTime = 0; }
  accumulator += dt;
  while (accumulator >= TICK) { update(TICK); accumulator -= TICK; }
  render();
  updateHUD();
  updateAbilityHUD();
  
  // Show level up screen if pending
  if (levelUpPending && levelUpChoices.length > 0 && document.getElementById('levelup-screen').style.display !== 'flex') {
    showLevelUp();
  }
  
  document.getElementById('debug').textContent =
    `FPS:${fps} Entities:${entities.filter(e=>e.alive).length} Clouds:${essenceClouds.length}`;
}
requestAnimationFrame(pcGameLoop);
</script>
</body>
</html>
