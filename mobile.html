<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden; background:#0a0a0f;
  font-family:'Inter',sans-serif; color:#e8e8ec;
  touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  overscroll-behavior:none;
}
canvas#gameCanvas { display:block; }

/* Title screen */
#title-screen {
  position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%);
}
#title-screen h1 {
  font-family:'Cormorant Garamond',serif; font-size:clamp(2.5rem,10vw,4rem);
  font-weight:700; letter-spacing:0.05em; color:#e8e8ec;
  text-shadow:0 0 40px rgba(78,200,176,0.3), 0 0 80px rgba(78,200,176,0.1);
  margin-bottom:0.5em;
}
#title-screen .subtitle { font-size:13px; color:#8888a0; margin-bottom:2em; text-align:center; line-height:1.6; padding:0 20px; }
#title-screen button {
  background:rgba(78,200,176,0.15); border:1px solid rgba(78,200,176,0.3);
  color:#4ec8b0; padding:14px 48px; font-size:18px; font-family:'Inter',sans-serif;
  font-weight:600; border-radius:8px; cursor:pointer; -webkit-tap-highlight-color:transparent;
}

/* Death screen */
#death-screen {
  position:fixed; inset:0; z-index:100; display:none; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(10,10,15,0.92);
}
#death-screen h2 {
  font-family:'Cormorant Garamond',serif; font-size:clamp(2rem,8vw,3.5rem);
  font-weight:700; color:#ff4466;
  text-shadow:0 0 30px rgba(255,68,102,0.4); margin-bottom:0.3em;
}
#death-screen .death-info { font-size:13px; color:#8888a0; margin-bottom:2em; text-align:center; line-height:1.8; padding:0 20px; }
#death-screen button {
  background:rgba(255,68,102,0.15); border:1px solid rgba(255,68,102,0.3);
  color:#ff6688; padding:14px 48px; font-size:18px; font-family:'Inter',sans-serif;
  font-weight:600; border-radius:8px; cursor:pointer; -webkit-tap-highlight-color:transparent;
}

/* Level Up screen */
#levelup-screen {
  position:fixed; inset:0; z-index:80; display:none; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(10,10,15,0.85); backdrop-filter:blur(4px);
}
#levelup-screen h3 {
  font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:700;
  color:#4ec8b0; margin-bottom:6px;
  text-shadow:0 0 20px rgba(78,200,176,0.4);
}
#levelup-screen .level-subtitle { font-size:12px; color:#8888a0; margin-bottom:16px; }
.skill-choices { display:flex; flex-direction:column; gap:10px; padding:0 16px; width:100%; max-width:340px; }
.skill-choice {
  background:rgba(20,20,30,0.9); border:2px solid rgba(255,255,255,0.1);
  border-radius:10px; padding:14px; cursor:pointer;
  display:flex; align-items:center; gap:12px; -webkit-tap-highlight-color:transparent;
}
.skill-choice:active { border-color:rgba(78,200,176,0.5); background:rgba(30,30,45,0.9); }
.skill-choice-icon { font-size:28px; flex-shrink:0; }
.skill-choice-info { flex:1; }
.skill-choice-name { font-size:14px; font-weight:700; color:#e8e8ec; }
.skill-choice-level { font-size:11px; color:#4ec8b0; font-weight:600; }
.skill-choice-desc { font-size:11px; color:#8888a0; line-height:1.3; margin-top:2px; }

/* HUD */
#hud { position:fixed; top:10px; left:10px; z-index:20; pointer-events:none; }
.hud-bar { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.hud-bar-label { font-size:10px; font-weight:600; color:#8888a0; width:32px; text-align:right; }
.hud-bar-track { width:100px; height:6px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; }
.hud-bar-fill { height:100%; border-radius:3px; transition:width 0.3s; }
.hp-fill { background:linear-gradient(90deg,#ff4466,#ff6688); }
.essence-fill { background:linear-gradient(90deg,#4ec8b0,#6ee8d0); }
.hud-text { font-size:10px; font-weight:600; color:#e8e8ec; font-variant-numeric:tabular-nums lining-nums; min-width:40px; }
.hud-level { font-size:11px; font-weight:700; color:#4ec8b0; }

#hud-stats {
  position:fixed; top:10px; right:10px; z-index:20; pointer-events:none;
  font-size:10px; color:#8888a0; text-align:right; line-height:1.6;
  font-variant-numeric:tabular-nums lining-nums;
}

/* Minimap */
#minimap {
  position:fixed; top:10px; right:10px; z-index:20; pointer-events:none;
  border:1px solid rgba(255,255,255,0.1); border-radius:4px;
  display:none; /* Hidden on mobile by default — too small screen */
}

/* Debug */
#debug {
  position:fixed; top:0; left:0; z-index:99999;
  background:rgba(0,0,0,0.75); color:#0f0;
  font:10px/1.5 monospace; padding:4px 8px;
  pointer-events:none; white-space:pre; display:none;
}

/* Touch controls */
#touch-controls { position:fixed; inset:0; z-index:30; pointer-events:none; }

/* Joystick area — left side */
#joystick-zone {
  position:fixed; bottom:0; left:0; width:50%; height:50%;
  z-index:31; pointer-events:auto; -webkit-tap-highlight-color:transparent;
}
#joystick-base {
  position:fixed; width:120px; height:120px;
  border-radius:50%; background:rgba(255,255,255,0.06); border:2px solid rgba(255,255,255,0.12);
  display:none; transform:translate(-50%,-50%);
  z-index:32; pointer-events:none;
}
#joystick-stick {
  position:fixed; width:50px; height:50px;
  border-radius:50%; background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.3);
  display:none; transform:translate(-50%,-50%);
  z-index:33; pointer-events:none;
}

/* Action buttons — right side */
.action-btn {
  position:fixed; z-index:31; pointer-events:auto;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; font-family:'Inter',sans-serif;
  -webkit-tap-highlight-color:transparent; transition:opacity 0.15s;
}
.action-btn:active { opacity:0.7; }

#btn-left-attack {
  bottom:60px; right:130px; width:70px; height:70px;
  background:rgba(255,68,102,0.2); border:2px solid rgba(255,68,102,0.4); color:#ff6688;
}
#btn-right-attack {
  bottom:120px; right:40px; width:70px; height:70px;
  background:rgba(100,130,255,0.2); border:2px solid rgba(100,130,255,0.4); color:#8090ff;
}
#btn-dash {
  bottom:20px; right:60px; width:56px; height:56px;
  background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.2); color:#aaa;
  font-size:12px;
}

/* Charge indicator */
#charge-indicator {
  position:fixed; width:80px; height:80px;
  border-radius:50%; border:3px solid transparent;
  display:none; transform:translate(-50%,-50%);
  z-index:34; pointer-events:none;
}

footer { position:fixed; bottom:2px; left:50%; transform:translateX(-50%); z-index:5; font-size:9px; }
footer a { color:#444; text-decoration:none; }

<body>

<div id="title-screen">
  <h1>Essence Arena</h1>
  <div class="subtitle">

    死してなお、魂は巡る
  </div>
  <button id="start-btn">始める</button>
  <div style="margin-top:1.5em;font-size:11px;color:#555;text-align:center;line-height:2">
    左側: 移動ジョイスティック<br>
    右側: 赤=左斬り / 青=右斬り / ⇢=ダッシュ<br>
    長押しで溜め → 離して斬る
  </div>
</div>

<div id="death-screen">
  <h2>散華</h2>
  <div class="death-info" id="death-info"></div>
  <button id="respawn-btn">転生する</button>
</div>

<div id="levelup-screen">
  <h3>覚 醒</h3>
  <div class="level-subtitle" id="levelup-subtitle">スキルを一つ選べ</div>
  <div class="skill-choices" id="skill-choices"></div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="touch-controls">
  <div id="joystick-zone"></div>
  <div id="joystick-base"></div>
  <div id="joystick-stick"></div>
  <button class="action-btn" id="btn-left-attack">赤</button>
  <button class="action-btn" id="btn-right-attack">青</button>
  <button class="action-btn" id="btn-dash">⇢</button>
</div>

<div id="hud">
  <div class="hud-bar">
    <span class="hud-bar-label">HP</span>
    <div class="hud-bar-track"><div class="hud-bar-fill hp-fill" id="hp-bar"></div></div>
    <span class="hud-text" id="hp-text">3.0/3.0</span>
  </div>
  <div class="hud-bar">
    <span class="hud-bar-label">Ess</span>
    <div class="hud-bar-track"><div class="hud-bar-fill essence-fill" id="essence-bar"></div></div>
    <span class="hud-text" id="essence-text">0</span>
    <span class="hud-level" id="level-text">Lv.0</span>
  </div>
</div>
<div id="hud-stats"></div>

<canvas id="minimap" width="100" height="100"></canvas>
<div id="debug"></div>

<footer>
  <a href="https://www.perplexity.ai/computer" target="_blank" rel="noopener noreferrer">

  </a>

<script src="game.js"></script>
<script>
// --- Mobile-specific input, touch controls & UI ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Prevent all default touch behaviors
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ========== JOYSTICK ==========
const joystickZone = document.getElementById('joystick-zone');
const joystickBase = document.getElementById('joystick-base');
const joystickStick = document.getElementById('joystick-stick');
let joystickTouch = null;
let joystickOrigin = { x: 0, y: 0 };
const JOYSTICK_RADIUS = 50;

joystickZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joystickTouch = t.identifier;
  joystickOrigin.x = t.clientX;
  joystickOrigin.y = t.clientY;
  joystickBase.style.left = t.clientX + 'px';
  joystickBase.style.top = t.clientY + 'px';
  joystickBase.style.display = 'block';
  joystickStick.style.left = t.clientX + 'px';
  joystickStick.style.top = t.clientY + 'px';
  joystickStick.style.display = 'block';
}, { passive: false });

joystickZone.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouch) {
      let dx = t.clientX - joystickOrigin.x;
      let dy = t.clientY - joystickOrigin.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > JOYSTICK_RADIUS) {
        dx = dx / dist * JOYSTICK_RADIUS;
        dy = dy / dist * JOYSTICK_RADIUS;
      }
      joystickStick.style.left = (joystickOrigin.x + dx) + 'px';
      joystickStick.style.top = (joystickOrigin.y + dy) + 'px';
      // Map to input
      const norm = Math.min(dist, JOYSTICK_RADIUS) / JOYSTICK_RADIUS;
      if (norm > 0.15) {
        inputMoveX = (dx / JOYSTICK_RADIUS);
        inputMoveY = (dy / JOYSTICK_RADIUS);
      } else {
        inputMoveX = 0;
        inputMoveY = 0;
      }
    }
  }
}, { passive: false });

function endJoystick(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouch) {
      joystickTouch = null;
      joystickBase.style.display = 'none';
      joystickStick.style.display = 'none';
      inputMoveX = 0;
      inputMoveY = 0;
    }
  }
}
joystickZone.addEventListener('touchend', endJoystick, { passive: false });
joystickZone.addEventListener('touchcancel', endJoystick, { passive: false });

// ========== ATTACK BUTTONS (hold to charge, release to swing) ==========
let leftAttackTouch = null;
let rightAttackTouch = null;

const btnLeft = document.getElementById('btn-left-attack');
const btnRight = document.getElementById('btn-right-attack');
const btnDash = document.getElementById('btn-dash');

btnLeft.addEventListener('touchstart', e => {
  e.preventDefault();
  leftAttackTouch = e.changedTouches[0].identifier;
  inputLeftAttack = true;
  btnLeft.style.background = 'rgba(255,68,102,0.4)';
}, { passive: false });
btnLeft.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === leftAttackTouch) {
      leftAttackTouch = null;
      btnLeft.style.background = 'rgba(255,68,102,0.2)';
    }
  }
}, { passive: false });
btnLeft.addEventListener('touchcancel', e => {
  leftAttackTouch = null;
  btnLeft.style.background = 'rgba(255,68,102,0.2)';
}, { passive: false });

btnRight.addEventListener('touchstart', e => {
  e.preventDefault();
  rightAttackTouch = e.changedTouches[0].identifier;
  inputRightAttack = true;
  btnRight.style.background = 'rgba(100,130,255,0.4)';
}, { passive: false });
btnRight.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === rightAttackTouch) {
      rightAttackTouch = null;
      btnRight.style.background = 'rgba(100,130,255,0.2)';
    }
  }
}, { passive: false });
btnRight.addEventListener('touchcancel', e => {
  rightAttackTouch = null;
  btnRight.style.background = 'rgba(100,130,255,0.2)';
}, { passive: false });

// ========== DASH BUTTON ==========
btnDash.addEventListener('touchstart', e => {
  e.preventDefault();
  inputDash = true;
  btnDash.style.background = 'rgba(255,255,255,0.2)';
}, { passive: false });
btnDash.addEventListener('touchend', e => {
  btnDash.style.background = 'rgba(255,255,255,0.08)';
}, { passive: false });
btnDash.addEventListener('touchcancel', e => {
  btnDash.style.background = 'rgba(255,255,255,0.08)';
}, { passive: false });

// ========== AUTO-AIM for mobile ==========
// On mobile, always use auto-aim since there's no mouse
inputAngleAuto = true;

function pollInput() {
  // Joystick already sets inputMoveX/inputMoveY via touch events
  // Auto-aim is always on for mobile
  inputAngleAuto = true;
}

// ========== LEVEL UP UI ==========
function showLevelUp() {
  const screen = document.getElementById('levelup-screen');
  const container = document.getElementById('skill-choices');
  const subtitle = document.getElementById('levelup-subtitle');
  subtitle.textContent = `Level ${getPlayerLevel()} — スキルを一つ選べ`;
  container.innerHTML = levelUpChoices.map((c, i) => `
    <div class="skill-choice" ontouchend="onSelectSkill(${i})">
      <div class="skill-choice-icon">${c.icon}</div>
      <div class="skill-choice-info">
        <div class="skill-choice-name">${c.name}</div>
        <div class="skill-choice-level">Lv.${c.currentLevel} → Lv.${c.nextLevel}</div>
        <div class="skill-choice-desc">${c.desc}</div>
      </div>
    </div>
  `).join('');
  screen.style.display = 'flex';
}

function hideLevelUp() {
  document.getElementById('levelup-screen').style.display = 'none';
}

window.onSelectSkill = function(index) {
  selectSkill(index);
  hideLevelUp();
};

// ========== DEATH SCREEN ==========
function onPlayerDeath(entity) {
  document.getElementById('death-screen').style.display = 'flex';
  document.getElementById('death-info').innerHTML =
    `倒された<br>蓄積エッセンスは死亡地点に散布された<br>` +
    `散布量: ${Math.floor(entity.totalEssence || 0)}`;
}

// ========== ABILITY HUD (simpler on mobile) ==========
function updateAbilityHUD() {
  // On mobile, the dash button already indicates dash; skip the ability slots
}

// ========== GAME START ==========
document.getElementById('start-btn').addEventListener('touchend', e => {
  e.preventDefault();
  document.getElementById('title-screen').style.display = 'none';
  startNewGame();
}, { passive: false });
// Also click for any edge case
document.getElementById('start-btn').addEventListener('click', e => {
  document.getElementById('title-screen').style.display = 'none';
  startNewGame();
});

document.getElementById('respawn-btn').addEventListener('touchend', e => {
  e.preventDefault();
  document.getElementById('death-screen').style.display = 'none';
  doRespawn();
}, { passive: false });
document.getElementById('respawn-btn').addEventListener('click', e => {
  document.getElementById('death-screen').style.display = 'none';
  doRespawn();
});

// ========== GAME LOOP ==========
let _lastT = 0;
function mobileGameLoop(timestamp) {
  requestAnimationFrame(mobileGameLoop);
  pollInput();
  const dt = Math.min((timestamp - _lastT) / 1000, 0.1);
  _lastT = timestamp;
  frames++; fpsTime += dt;
  if (fpsTime >= 1) { fps = frames; frames = 0; fpsTime = 0; }
  accumulator += dt;
  while (accumulator >= TICK) { update(TICK); accumulator -= TICK; }
  render();
  updateHUD();

  // Level up popup
  if (levelUpPending && levelUpChoices.length > 0 && document.getElementById('levelup-screen').style.display !== 'flex') {
    showLevelUp();
  }

  // Update dash button visual based on stock
  if (player && player.dashStocks > 0) {
    btnDash.style.borderColor = 'rgba(120,140,255,0.5)';
    btnDash.style.color = '#8090ff';
  } else {
    btnDash.style.borderColor = 'rgba(255,255,255,0.15)';
    btnDash.style.color = '#555';
  }

  document.getElementById('debug').textContent =
    `FPS:${fps} E:${entities.filter(e=>e.alive).length} C:${essenceClouds.length}`;
}
requestAnimationFrame(mobileGameLoop);
</script>
</body>
